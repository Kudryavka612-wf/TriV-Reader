name: Build & Release

# v1.2.3 のようなタグを push すると、クラウドで自動ビルド＆リリースします。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # リリース作成に必要

jobs:
  build:
    runs-on: windows-latest
    # Windows ランナーの標準出力は既定が cp1252 のため、日本語 print が
    # UnicodeEncodeError で落ちる。Python の入出力を UTF-8 に固定して回避する。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: ソース取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: バージョンとタグの一致確認
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'.'); from viewer.version import APP_VERSION; print(APP_VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "APP_VERSION ($v) がタグ (${{ github.ref_name }}) と一致しません。viewer/version.py を更新してください。"
            exit 1
          }

      - name: テスト実行（失敗したらリリースしない）
        run: |
          python smoke_test.py
          python updater_test.py
          python govform_interact_test.py
          python govform_input_test.py
          python annot_interact_test.py
          python annot_list_test.py
          python folder_lock_test.py
          python settings_test.py
          python zoom_test.py
          python print_test.py
          python print_paper_test.py
          python text_select_test.py
          python gesture_test.py
          python compress_test.py
          python compress_gui_test.py
          python render_cache_test.py
          python theme_test.py
          python robust_test.py
          python undo_test.py
          python session_test.py
          python links_test.py
          python tabs_test.py

      - name: ビルド（exe 化）
        run: python build_exe.py

      - name: リリースノートを用意（注釈付きタグの本文を使う）
        # 日本語が化けないよう、git の出力を PowerShell に通さず bash で
        # そのままファイルへ書く（Windows ランナーのコンソールは UTF-8 では
        # ないので、パイプを通すと壊れる）。
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          # checkout が浅い取得のときでもタグ本体を読めるようにする
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" || true
          if [ "$(git cat-file -t "$tag" 2>/dev/null)" = "tag" ]; then
            # 注釈付きタグ: メッセージ全文をそのままリリースノートにする
            git tag -l --format='%(contents)' "$tag" > release_notes.txt
          else
            # 軽量タグ: %(contents) はコミットメッセージに化けるので使わない
            echo "$tag" > release_notes.txt
          fi
          [ -s release_notes.txt ] || echo "$tag" > release_notes.txt
          echo "--- release notes ---"
          cat release_notes.txt

      - name: zip / update.json 生成
        run: >
          python make_release.py
          --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          --notes-file release_notes.txt

      - name: Inno Setup 導入（インストーラ生成用）
        run: choco install innosetup -y --no-progress

      - name: インストーラ生成 (Setup.exe)
        run: python make_installer.py

      - name: GitHub リリース作成＆アップロード
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Join-Path $env:USERPROFILE "TriVReader_release"
          $zip = (Get-ChildItem (Join-Path $rel "TriVReader-*.zip")).FullName
          $setup = (Get-ChildItem (Join-Path $rel "TriVReader-Setup-*.exe")).FullName
          $json = Join-Path $rel "update.json"
          gh release create "${{ github.ref_name }}" "$zip" "$setup" "$json" `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --notes-file release_notes.txt
